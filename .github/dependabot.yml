# Author:            Kevin Street
# Created on:        2026-11-10
# Last modified on:  2026-11-10
#
# Opens weekly pull requests that update the pinned Actions, the uv
# lockfile and the Terraform providers, each kind's updates grouped
# into one pull request. A provider's new major version waits for a
# reviewed change to its range in the root's versions.tf.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: terraform
    directories: ["/infra/snowflake"]
    schedule:
      interval: weekly
    groups:
      terraform:
        patterns: ["*"]
